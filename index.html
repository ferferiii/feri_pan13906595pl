<style>
@font-face{font-family:Vazirmatn;src:url(Vazirmatn.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--bg:#EFE8E3;--card:#FBF6F2;--ink:#3A3D43;--mute:#7B838C;--line:#E3D8D1;--acc:#D4968A;--on:#fff;--ok:#8FB59B;--wr:#E7B27F;--no:#C76F7A;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#1F2428;--card:#292F34;--ink:#EDE6E1;--mute:#9BA5AD;--line:#394149;--acc:#E3A99E;--on:#2A1F1C;--ok:#8FC3A0;--wr:#EDB987;--no:#E58A94;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 Vazirmatn,Tahoma,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 14px 40px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1{font-size:20px;margin:0;font-weight:800}
h2{font-size:16px;margin:16px 2px 8px}
.top{display:flex;align-items:center;gap:8px}
.top span{color:var(--mute);font-size:13px}
.tabs,.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;margin:0 -14px;scrollbar-width:none}
.chips{flex-wrap:wrap;overflow:visible;margin:0;padding:4px 0 8px}
.tabs button,.chip{flex:none;padding:3px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:14px}
.tabs [aria-current],.chip.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 14px;margin-bottom:12px}
details.card summary{cursor:pointer}details.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}details.fold>summary::-webkit-details-marker{display:none}details.fold>summary::after{content:"‹";margin-inline-start:auto;font-size:1.3em;color:var(--mute);transition:transform .2s}details.fold[open]>summary::after{transform:rotate(-90deg)}details.fold[open]>summary{margin-bottom:8px}details.fold:not(.card){margin:10px 0}details.fold>summary h2{margin:6px 0}
ul{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--mute)}
.x{color:var(--mute);font-size:20px;padding:0 6px}
.add{display:flex;gap:8px;margin:8px 0}
.add input,.add select,textarea{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:7px 12px}
.add select{flex:none}
textarea{width:100%;min-height:64px;display:block;margin:2px 0 8px}
.btn{background:var(--acc);color:var(--on);border-radius:12px;padding:7px 14px;font-weight:600;flex:none}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--mute);flex:none}
.s1 .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.s2 .chk{background:var(--no);border-color:var(--no);color:#fff}
.s3 .chk{background:var(--wr);border-color:var(--wr);color:#fff}
.s2 .grow{text-decoration:line-through;color:var(--mute)}
.empty{color:var(--mute);text-align:center;padding:10px}
.gr{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:8px 0}
.c{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);font-size:11px;background:var(--bg);color:var(--mute);padding:0}
.c.g1{background:var(--ok);color:#fff}.c.g2{background:var(--wr);color:#fff}.c.g3{background:var(--no);color:#fff}
.c.td{outline:2px solid var(--acc)}.c.lk,.c:disabled{opacity:.35}
.err{background:color-mix(in srgb,var(--no) 18%,var(--card));border:1px solid var(--no);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:14px}
.hh{display:flex;align-items:center;gap:8px}
.nav{display:flex;align-items:center;justify-content:space-between;margin:4px 0}
.nav button{font-size:22px;padding:0 12px}
.bars{display:flex;gap:3px;height:120px;margin:8px 0}
.bc{flex:1;display:flex;flex-direction:column;font-size:10px;color:var(--mute);text-align:center}
.bc div{flex:1;display:flex;align-items:flex-end}
.bc i{display:block;width:100%;background:var(--acc);border-radius:5px 5px 0 0;min-height:2px}
.fr{display:flex;align-items:center;gap:8px;font-size:13px}
.fr>span:first-child{width:44px}
.fb{flex:1;height:10px;background:var(--bg);border-radius:6px;overflow:hidden}
.fb i{display:block;height:100%}
.fi{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin:2px 0 8px;display:block}
.pr{flex:none;font-size:12px;border-radius:10px;padding:0 8px;border:1px solid var(--line);color:var(--mute)}
.pr.p1{border-color:var(--wr);color:var(--wr)}.pr.p2{border-color:var(--no);color:var(--no);font-weight:600}
.big{font-size:22px;font-weight:800;color:var(--acc)}
@media print{.tabs,.top button,.noprint,#bn{display:none!important}body{background:#fff!important;color:#000}.card{break-inside:avoid}}
.chk:disabled{opacity:.3;cursor:default}
.tabs .chip button{border:0;background:none;padding:0 4px;font-size:15px}
.fab{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;background:var(--acc);color:var(--on);font-size:22px;z-index:7;box-shadow:0 2px 10px #0004}
.pmw{position:fixed;inset:0;background:#0007;z-index:8;display:flex;align-items:center;justify-content:center;padding:14px}.pmw[hidden]{display:none}
.pmc{background:var(--card);border-radius:22px;padding:16px;max-width:420px;width:100%;max-height:90vh;overflow:auto}
.pmt{font-size:56px;font-weight:800;text-align:center;color:var(--acc);line-height:1.3}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
.pb{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:12px;padding:4px 8px;background:var(--card);font-size:13px}.pb.on{border-color:var(--acc)}
.pb i{width:14px;height:22px;border-radius:4px;display:block}
.tg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.tl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center}.tl b{display:block;font-size:20px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cc{aspect-ratio:.8;border:1px solid var(--line);border-radius:10px;background:var(--card);display:flex;flex-direction:column;align-items:center;padding:2px;font-size:11px}.cc.td{outline:2px solid var(--acc)}
.wk7{display:flex;gap:8px;overflow-x:auto}.wc{min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px}
.wt{font-size:13px;display:flex;gap:4px;align-items:center}.wt.s1{text-decoration:line-through;color:var(--mute)}
.acc{cursor:pointer;user-select:none}
.cap{font-size:12px;color:var(--mute);background:color-mix(in srgb,var(--acc) 14%,var(--bg));border:1px dashed var(--acc);border-radius:10px;padding:4px 10px;margin:14px 0 8px;text-align:center}
.dot{display:inline-block;width:22px;height:22px;border-radius:50%;vertical-align:middle}
.tw{overflow-x:auto;margin:0 -6px;padding:0 6px 4px}
table.an{border-spacing:4px;border-collapse:separate;min-width:660px;width:100%;table-layout:fixed}
table.an th{font-size:10px;line-height:1.35;font-weight:600;border-radius:9px;padding:4px 2px;color:#4a4a4a}
table.an td{background:var(--bg);border:1px solid var(--line);border-radius:9px;height:30px;text-align:center;font-size:13px}
table.an td.nm{background:color-mix(in srgb,var(--line) 70%,var(--card))}
table.an td.e{background:color-mix(in srgb,var(--card) 70%,#fff)}
table.an td.f{background:#fff;font-weight:700}
table.an .stk{position:sticky;right:0;z-index:1;background:var(--card)}
.hint{font-size:11px;color:var(--mute);text-align:left;margin:2px 4px 0}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0}
.cell{border-radius:12px;padding:5px 3px 6px;text-align:center;color:#444}
.cell small{display:block;font-size:10px;line-height:1.3;min-height:26px}
.cell b{display:block;font-size:18px;line-height:1.3;background:#ffffffb8;border-radius:9px;margin-top:2px}
